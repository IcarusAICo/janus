[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janus"
version = "0.1.0"
description = "Shared-state dynamic decision model research experiment"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["torch>=2.6", "transformers>=5.3,<5.4", "peft>=0.19,<0.20", "numpy>=1.26", "huggingface_hub>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
study = ["datasets>=4.5,<5", "matplotlib>=3.9"]
demos = [
    "typesafe_sdk>=0.7",
    "system-one-adapter[openai]>=0.1",
    "httpx>=0.27",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "websockets>=12",
    "vizdoom>=1.2",
    "playwright>=1.48",
    "pillow>=10",
]

[project.scripts]
janus = "janus.__main__:main"

[tool.setuptools.packages.find]
include = ["janus*", "demos*"]

[tool.setuptools.package-data]
janus = ["precapture.json"]
demos = ["**/*.html", "**/*.css", "**/*.js", "**/*.json", "**/licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
